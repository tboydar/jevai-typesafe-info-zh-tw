name: Demo tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Run offline policy tests
        run: bun run test
      - name: Check browser JavaScript syntax
        run: node --check public/app.js
